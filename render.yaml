# Render Blueprint - documents how this service is configured, reusing the
# exact pattern from the Subtitle Video & Timing Editor app.
services:
  - type: web
    name: crowdin-transcreation-pipeline
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CROWDIN_CLIENT_ID
        sync: false
      - key: CROWDIN_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REGENERATE_ENDPOINT_SHARED_SECRET
        sync: false
