# Render Blueprint - documents how this service is configured, reusing the
# exact pattern from the Subtitle Video & Timing Editor app. This service is
# actually deployed via a manual "Public Git Repository" connection, not this
# Blueprint (see the plan doc) - this file is documentation of the live
# config, kept in sync by hand, not something Render re-applies on push.
#
# GOOGLE_APPLICATION_CREDENTIALS also requires a Secret File in Render (not
# expressible in this Blueprint's envVars list) - see lib/gemini.js's header
# and .env.example: the GCP service account's full JSON keyfile is uploaded
# as a Secret File (e.g. named gcp-service-account.json), which Render
# mounts at /etc/secrets/gcp-service-account.json, and
# GOOGLE_APPLICATION_CREDENTIALS is set to that mounted path.
services:
  - type: web
    name: crowdin-transcreation-pipeline
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CROWDIN_CLIENT_ID
        sync: false
      - key: CROWDIN_CLIENT_SECRET
        sync: false
      - key: GCP_PROJECT_ID
        sync: false
      - key: GCP_LOCATION
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: REGENERATE_ENDPOINT_SHARED_SECRET
        sync: false
