name: Keep Render instance awake

# Same rationale as the Subtitle Video & Timing Editor app's keep-alive
# workflow: Render's free tier spins down after ~15 minutes idle, which
# would otherwise mean a 30-90s+ cold-start delay the first time a labeled
# file's webhook arrives after a quiet period.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://crowdin-transcreation-pipeline.onrender.com/manifest.json
